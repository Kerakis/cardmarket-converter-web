version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependencies
    # Two PRs a week at most: everything non-major in one, every major in the
    # other. Keeping all majors together stops coupled toolchains (eslint + its
    # plugins, vite + vite-plugin-svelte) from landing in separate PRs. If one
    # major is broken, add it to an `ignore:` list here until it isn't.
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
